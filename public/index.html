<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TKAI QA – Opprett sesjon</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <canvas id="particles-canvas"></canvas>
  <div class="container">
    <header class="hero">
      <h1>Q<span class="amp">&</span>A</h1>
      <p class="tagline">Spørsmål &amp; svar for ditt neste foredrag</p>
    </header>

    <section id="create-section" class="card">
      <h2>Opprett ny sesjon</h2>
      <form id="create-form">
        <label for="title">Foredragstittel</label>
        <input type="text" id="title" placeholder="f.eks. AI i hverdagen" required maxlength="120">

        <label for="speaker">Foredragsholder</label>
        <input type="text" id="speaker" placeholder="Ditt navn" required maxlength="80">

        <label for="event-slug">TKAI-arrangement (valgfritt)</label>
        <input type="text" id="event-slug" list="event-options" placeholder="f.eks. tkai-7" maxlength="20" autocomplete="off"
               pattern="[Tt][Kk][Aa][Ii]-[0-9]+" title="Skriv som tkai-7, tkai-8 osv.">
        <datalist id="event-options"></datalist>

        <div id="organizer-field" style="display:none;">
          <label for="organizer-key">Arrangørkode</label>
          <input type="password" id="organizer-key" placeholder="Kreves for TKAI-arrangement" maxlength="200" autocomplete="off">
        </div>

        <div class="image-upload">
          <label>Profilbilde (valgfritt)</label>
          <div class="image-upload-area">
            <div class="image-preview" id="image-preview" onclick="document.getElementById('image-input').click()">
              <span class="image-preview-placeholder" id="image-placeholder">Last opp</span>
            </div>
            <input type="file" id="image-input" accept="image/*">
            <span class="image-upload-text">Klikk for å laste opp bilde</span>
          </div>
        </div>

        <button type="submit" class="btn btn-primary">Opprett sesjon</button>
      </form>
    </section>


    <footer class="site-footer">utviklet av <a href="https://www.superponni.no" target="_blank" rel="noopener">Superponni.no</a></footer>
  </div>

  <script>
    const form = document.getElementById('create-form');
    const imageInput = document.getElementById('image-input');
    const imagePreview = document.getElementById('image-preview');
    let speakerImageBase64 = null;

    // Arrangørkoden huskes på denne enheten. Feltet vises bare når et arrangement er fylt inn.
    const ORGANIZER_STORAGE = 'tkai-organizer-key';
    const eventInput = document.getElementById('event-slug');
    const organizerField = document.getElementById('organizer-field');
    const organizerInput = document.getElementById('organizer-key');
    try { organizerInput.value = localStorage.getItem(ORGANIZER_STORAGE) || ''; } catch (e) {}
    function toggleOrganizerField() {
      organizerField.style.display = eventInput.value.trim() ? '' : 'none';
    }
    eventInput.addEventListener('input', toggleOrganizerField);

    // Fyll nedtrekkslisten med TKAI-arrangementer. Tom liste = bare fritekst.
    fetch('/api/events')
      .then(r => r.json())
      .then(events => {
        const list = document.getElementById('event-options');
        events.forEach(ev => {
          const opt = document.createElement('option');
          opt.value = ev.slug;
          opt.label = [ev.number ? `TKAI #${ev.number}` : null, ev.title, ev.date].filter(Boolean).join(' · ');
          list.appendChild(opt);
        });
      })
      .catch(() => {});

    // Resize image to max 256x256 before upload
    function resizeImage(file, maxSize) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let w = img.width, h = img.height;
          if (w > h) { if (w > maxSize) { h = Math.round(h * maxSize / w); w = maxSize; } }
          else { if (h > maxSize) { w = Math.round(w * maxSize / h); h = maxSize; } }
          canvas.width = w;
          canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.85));
        };
        img.src = URL.createObjectURL(file);
      });
    }

    // Image upload preview
    imageInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const resized = await resizeImage(file, 256);
      speakerImageBase64 = resized;
      imagePreview.innerHTML = `<img src="${resized}" alt="Preview">`;
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value.trim();
      const speaker = document.getElementById('speaker').value.trim();
      const eventSlug = document.getElementById('event-slug').value.trim().toLowerCase();
      const organizerKey = eventSlug ? organizerInput.value.trim() : '';

      const btn = form.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.textContent = 'Oppretter...';

      const res = await fetch('/api/sessions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, speaker, speakerImage: speakerImageBase64, eventSlug, organizerKey }),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        alert(err.error || 'Noe gikk galt. Prøv igjen.');
        btn.disabled = false;
        btn.textContent = 'Opprett sesjon';
        return;
      }

      const session = await res.json();
      try {
        if (session.organizer_rejected) {
          localStorage.removeItem(ORGANIZER_STORAGE);
        } else if (session.event_slug && organizerKey) {
          localStorage.setItem(ORGANIZER_STORAGE, organizerKey);
        }
      } catch (e) {}
      if (session.organizer_rejected) {
        alert('Feil arrangørkode. Sesjonen er laget, men uten kobling til TKAI-arrangement.');
      }
      localStorage.setItem('tkai-last-session', JSON.stringify({ slug: session.slug }));
      window.location.href = `/s/${session.slug}/speaker?k=${encodeURIComponent(session.admin_key)}`;
    });
  </script>
  <script src="/js/version.js"></script>
  <script src="/js/particles.js"></script>
</body>
</html>
